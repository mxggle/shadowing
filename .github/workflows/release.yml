# Builds Shadowing.app as a DMG (what people download: open it, drag Shadowing into Applications) and a zip, plus the signed update for the in-app updater (src-tauri/src/update.rs).
# - Pushing a tag vX.Y.Z: checks the tag matches the app version, then creates a DRAFT release with the zip, the
#   update (Shadowing-X.Y.Z-macos-arm64.app.tar.gz + .sig) and latest.json, notes from CHANGELOG.md (or replaces
#   those files on a draft that already exists; a published release is left alone). Files: scripts/release-assets.sh. Review the draft, then publish it: installed apps only see
#   latest.json of the newest *published* release, so publishing is what offers the update.
# - Signing (scripts/release-assets.sh): the app with our own code-signing certificate, the update with the updater
#   key. Repository secrets: SHADOWING_CODESIGN_P12 (base64 .p12), SHADOWING_CODESIGN_PASSWORD,
#   TAURI_SIGNING_PRIVATE_KEY (contents of the .key file), TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#   A tag build fails without them; other builds then make an ad-hoc signed DMG and zip only.
# - Running it by hand (Actions → Release → Run workflow), or a PR that touches the version or the release
#   tooling (release/vX.Y.Z PRs, changes to this file): only builds, and keeps the files as a workflow artifact.
# - Pushes to main that change Rust dependencies, and a weekly run: only build, to keep the compiled dependencies
#   in the cache. A tag build can only restore a cache saved on main, and without one it compiles every
#   dependency from scratch (about 7 of its ~18 minutes).
# - Faster still: scripts/release-local.sh builds and uploads the release from your Mac.
name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/release.yml
  schedule:
    - cron: "0 3 * * 1" # Mondays: GitHub drops caches unused for 7 days
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/check-version.sh
      - scripts/release-notes.sh
      - scripts/update-manifest.sh
      - scripts/release-assets.sh
      - rust-toolchain.toml
      - src-tauri/tauri.conf.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(scripts/check-version.sh "$GITHUB_REF_NAME")
          else
            version=$(scripts/check-version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build the app
        run: npm run tauri build -- --bundles app

      - name: Sign and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHADOWING_CODESIGN_P12: ${{ secrets.SHADOWING_CODESIGN_P12 }}
          SHADOWING_CODESIGN_PASSWORD: ${{ secrets.SHADOWING_CODESIGN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$SHADOWING_CODESIGN_P12" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::A release needs the signing secrets (see scripts/release-assets.sh)." && exit 1
            fi
            export SHADOWING_UNSIGNED=1
          fi
          scripts/release-assets.sh "$VERSION" src-tauri/target/release/bundle release

      - name: Keep the files (builds without a tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Shadowing-${{ steps.version.outputs.version }}-macos-arm64
          path: release/Shadowing-${{ steps.version.outputs.version }}-*
          retention-days: 14

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(release/*.dmg release/*.zip release/*.app.tar.gz release/*.sig release/latest.json)
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            # Published already (e.g. by scripts/release-local.sh): installed apps may be updating from it.
            echo "::notice::Release $TAG is already published; leaving its files alone."
          elif gh release view "$TAG" > /dev/null 2>&1; then
            echo "Draft $TAG already exists; replacing its files."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "Shadowing $VERSION" --notes-file release/notes.md
          fi
