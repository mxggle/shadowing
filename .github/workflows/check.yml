# Runs `npm run check` (tsc + vite build + vitest + cargo fmt/clippy/test) on every PR and every push to main, on two systems:
# - macOS on Apple Silicon, the platform the app ships for (whisper.cpp needs Metal and cmake);
# - Windows x86_64, for the Windows port: it builds, lints and tests the same code. The runner has no sound card,
#   so the tests that need real audio hardware stay ignored there. An installer to try on a real PC comes from
#   windows-build.yml.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tools
        run: |
          cmake --version | head -1 || brew install cmake
          node --version
          rustc --version

      - run: npm ci

      - name: Versions agree
        run: scripts/check-version.sh

      - run: npm run check

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # bindgen (signalsmith-stretch) finds libclang here; the runner image has LLVM installed.
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      # Files must come out with LF line endings: the shell scripts can't take CRLF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            plugins/youtube

      - name: Tools
        run: |
          node --version
          rustc --version
          clang --version | head -1 || true

      - run: npm ci

      - run: npm run check
